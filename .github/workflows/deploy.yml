name: Publish and deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_CORE_OUTPUT: none

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Publish verified image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Pin and verify source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main
          CHECK="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name == "ci" and .app.slug == "github-actions")] | sort_by(.id) | last | .conclusion')"
          test "$CHECK" = success
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        env:
          AZURE_CORE_OUTPUT: json
        with:
          client-id: ${{ vars.AZURE_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate to the project registry
        env:
          REGISTRY: ${{ vars.AZURE_REGISTRY_NAME }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: az acr login --name "$REGISTRY" --subscription "$SUBSCRIPTION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ vars.AZURE_REGISTRY_NAME }}.azurecr.io/voice-action-lab:${{ steps.source.outputs.sha }}
          build-args: SOURCE_COMMIT=${{ steps.source.outputs.sha }}
          provenance: mode=min
      - name: Record the immutable image identity
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE: ${{ steps.source.outputs.sha }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "Verified source: $SOURCE" >> "$GITHUB_STEP_SUMMARY"
          echo "Published image: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment is a separate, explicitly enabled job." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy owner-only application
    needs: build
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        env:
          AZURE_CORE_OUTPUT: json
        with:
          client-id: ${{ vars.AZURE_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the verified digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          REGISTRY: ${{ vars.AZURE_REGISTRY_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="$REGISTRY.azurecr.io/voice-action-lab@$DIGEST"
          az containerapp update --subscription "$SUBSCRIPTION" --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --image "$IMAGE" --output none
          ACTUAL="$(az containerapp show --subscription "$SUBSCRIPTION" --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query properties.template.containers[0].image --output tsv)"
          test "$ACTUAL" = "$IMAGE"
          echo "Deployed: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
