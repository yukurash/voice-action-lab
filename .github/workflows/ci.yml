name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  infrastructure:
    name: Bicep compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile infrastructure without Azure credentials
        shell: pwsh
        run: |
          foreach ($template in Get-ChildItem infra -Filter *.bicep) {
            az bicep build --file $template.FullName --outfile (Join-Path $env:RUNNER_TEMP "$($template.BaseName).json")
            if ($LASTEXITCODE -ne 0) { throw "Bicep failed: $($template.Name)" }
          }

  ci:
    name: ci
    if: ${{ always() }}
    needs: [checks, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every platform check to succeed
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
          INFRA_RESULT: ${{ needs.infrastructure.result }}
        run: test "$CHECK_RESULT" = success && test "$INFRA_RESULT" = success
